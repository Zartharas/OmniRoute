name: Validate NVIDIA two-target reproduction

on:
  pull_request:
    branches:
      - release/v3.8.50
    paths:
      - "tests/unit/nvidia-two-target-abort-repro-8575.test.ts"
      - ".github/workflows/validate-nvidia-two-target-repro.yml"

permissions:
  contents: read

jobs:
  focused-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused reproduction
        run: node --import tsx --test tests/unit/nvidia-two-target-abort-repro-8575.test.ts

      - name: Lint focused reproduction
        run: npx eslint tests/unit/nvidia-two-target-abort-repro-8575.test.ts --max-warnings=0
